[package]
name = "bot"
version.workspace = true
edition.workspace = true

[dependencies]
common = { workspace = true }
logger = { workspace = true }
metrics = { workspace = true }
storage = { workspace = true }
# Only for bin_price/bin_resolvable, to turn a proposed /open bin range into what it means in
# price terms and to check it is one this pool's bin step can actually represent -- this crate
# never builds or signs a transaction (see the keyless guard), so nothing else from the DLMM
# math or transaction-building crates belongs here.
dlmm_math = { workspace = true }
clap = { workspace = true }
eyre = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
sqlx = { workspace = true }
chrono = { workspace = true }
humantime = { workspace = true }
teloxide = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
rust_decimal = { workspace = true }
reqwest = { workspace = true }

[dev-dependencies]
# Test-only: building sample PositionRow/SignalWithRationale fixtures needs a Uuid value.
# Not a runtime dependency of this crate -- storage owns every real id it hands back.
uuid = "1"
