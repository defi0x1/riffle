[workspace]
members = ["bin/*", "libraries/*", "tests"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
# Local
common = { path = "libraries/common" }
logger = { path = "libraries/logger" }
metrics = { path = "libraries/metrics" }
source = { path = "libraries/source" }
dlmm_decode = { path = "libraries/dlmm_decode" }
dlmm_math = { path = "libraries/dlmm_math" }
storage = { path = "libraries/storage" }
engine = { path = "libraries/engine" }

# Solana
#
# lb_clmm is Meteora's on-chain DLMM program crate, and this is intentionally a local path
# dependency rather than a pinned git dependency on a public repository. MeteoraAg/dlmm-sdk
# removed the on-chain program source from its history in March 2025 -- the last commit that
# had it is v0.8.2, built against anchor-lang 0.28 and solana-program ~1.16, and the repository
# has published only the client SDK since. That snapshot's dependency tree does not resolve
# alongside this workspace's solana-sdk 2.x stack (a hard curve25519-dalek version conflict at
# `cargo metadata` time, verified directly) and predates symbols this workspace's decode layer
# depends on, so it cannot stand in for the version actually built and tested against. A clone
# of this repository needs a local checkout of the matching source at ../DLMM until that gap is
# closed some other way.
lb_clmm = { path = "../DLMM/programs/lb_clmm", default-features = false, features = ["no-entrypoint"] }
solana-rpc-client = "2.1"
solana-rpc-client-api = "2.1"
solana-sdk = "2.1"
solana-account-decoder = "2.1"
yellowstone-grpc-client = "9"
yellowstone-grpc-proto = "9"

# Runtime
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
futures = "0.3"
async-trait = "0.1"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "chrono", "rust_decimal", "macros", "migrate"] }
rust_decimal = "1.36"

# HTTP
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
reqwest-middleware = "0.4"
reqwest-retry = "0.7"

# Telegram
teloxide = { version = "0.13", features = ["macros"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Metrics
prometheus = "0.13"
axum = "0.8"

# Misc
clap = { version = "4", features = ["derive", "env"] }
eyre = "0.6"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
humantime = "2"
humantime-serde = "1"
chrono = { version = "0.4", features = ["serde"] }
backon = "1"
bs58 = "0.5"
borsh = "1"

[profile.dev]
opt-level = 1
overflow-checks = false

[profile.bench]
debug = true
