# Example config for `bot`. Copy to config/bot.yaml (gitignored) and edit.
# Every field here can also be set as a CLI flag or an env var of the same name.

log:
  level: info
  format: pretty

postgres:
  url: ${DATABASE_URL}

metrics:
  listen_addr: 0.0.0.0:9103

telegram:
  bot_token: ${TELEGRAM_BOT_TOKEN}
  allowed_chats: [123456789, -987654321]
