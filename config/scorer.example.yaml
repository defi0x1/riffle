# Example config for `scorer`. Copy to config/scorer.yaml (gitignored) and edit.
# Every field here can also be set as a CLI flag or an env var of the same name.

log:
  level: info
  format: pretty

postgres:
  url: ${DATABASE_URL}

metrics:
  listen_addr: 0.0.0.0:9102

# Worker tick intervals.
tick:
  indicators_s: 300
  risk_gate_s: 300
  outcomes_s: 3600
