[[licenses.clarify]]
crate = "storage"
expression = "LicenseRef-Proprietary"
license-files = []

[bans]
# Duplicate crate versions are common in a graph this size (solana-sdk's own dependency
# tree pins several crates independently of what the rest of the workspace wants) and are
# not, by themselves, a security or licensing problem -- surfaced as a warning to look at,
# not a build failure to chase on every `cargo update`.
multiple-versions = "warn"
wildcards = "allow"

deny = [
    # openssl/native-tls is pulled in transitively by teloxide-core's reqwest 0.11 dependency
    # (bin/bot only; every other reqwest user in this workspace pins rustls-tls with
    # default-features = false, see the workspace Cargo.toml comment on the `reqwest` entry).
    # Not banned here: banning it would fail this exact tree today, and swapping teloxide's
    # TLS backend is a Cargo.toml change outside this file's scope. Left as a comment, not a
    # deny rule, so it is not forgotten -- worth revisiting if teloxide ever exposes a
    # rustls feature flag.
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
