# Points Grafana at the dashboard JSON files so they load on startup without a manual
# import.
apiVersion: 1

providers:
  - name: riffle
    orgId: 1
    folder: riffle
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/dashboards
