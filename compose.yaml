services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-feefarm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-feefarm}
      POSTGRES_DB: ${POSTGRES_DB:-feefarm}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-feefarm} -d ${POSTGRES_DB:-feefarm}"]
      interval: 5s
      timeout: 5s
      retries: 10

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    # binaries run on the host, not in compose; this lets the container reach them
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      # Local-use only: dashboards load without a login prompt. Anonymous sessions get
      # Viewer, not Editor -- changes still have to go through the admin login or the
      # provisioning files.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      # Read by the Timescale datasource provisioning file (observability/grafana/
      # provisioning/datasources/datasources.yml) so it can point at the same database
      # and credentials as the postgres service without duplicating them.
      POSTGRES_DB: ${POSTGRES_DB:-feefarm}
      POSTGRES_USER: ${POSTGRES_USER:-feefarm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-feefarm}
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - postgres

volumes:
  pgdata:
  prometheus-data:
  grafana-data:
