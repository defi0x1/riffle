[package]
name = "dlmm_tx"
version.workspace = true
edition.workspace = true

[dependencies]
dlmm_decode = { workspace = true }
solana-sdk = { workspace = true }
borsh = { workspace = true, features = ["derive"] }
eyre = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
# Only used by tests/fixtures.rs to serialise an unsigned Transaction to the same wire format
# `VersionedTransaction.deserialize()` reads on the TypeScript side. Already pulled in
# transitively by solana-sdk's own "full" feature set (see Cargo.lock), so this adds no new
# dependency to the build graph -- just names one that's already there.
bincode = "1.3.3"
# Only used by tests/onchain_validation.rs, which is gated on a reachable validator or RPC
# endpoint (see that file's module doc) and never runs in a normal `cargo test`. Both are
# already in the dependency graph transitively via solana-sdk's own client tooling.
solana-rpc-client = { workspace = true }
solana-rpc-client-api = { workspace = true }
solana-transaction-error = "2"
