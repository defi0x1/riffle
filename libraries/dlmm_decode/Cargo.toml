[package]
name = "dlmm_decode"
version.workspace = true
edition.workspace = true

[dependencies]
solana-sdk = { workspace = true }
borsh = { workspace = true, features = ["derive"] }
eyre = { workspace = true }
thiserror = { workspace = true }
# Not in workspace.dependencies: only this crate casts raw account bytes onto the zero-copy
# wire structs in accounts/wire.rs (derive for the struct-level Pod/Zeroable impls,
# min_const_generics for the 70-element bin arrays).
bytemuck = { version = "1.20", features = ["derive", "min_const_generics", "extern_crate_std"] }

[dev-dependencies]
solana-sdk = { workspace = true }
